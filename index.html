<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fibra | Procedural Texture Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎨 Fibra</h1>
    <p>تولید تکسچرهای بدون درز و PBR، مستقیم در مرورگر</p>
  </header>

  <main class="workspace">
    <div class="preview-area">
      <canvas id="canvas"></canvas>
      <div class="preview-actions">
        <button id="randomizeBtn">🎲 تصادفی</button>
        <button id="downloadBtn">⬇️ دانلود 1024px</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>پریست پایه</label>
        <select id="preset">
          <option value="cosmic-rock">سنگ کهکشانی</option>
          <option value="magic-wood">چوب جادویی</option>
          <option value="neon-metal">فلز نئونی</option>
        </select>
      </div>
      
      <div class="control-group">
        <label>رنگ پایه (Hue) <span id="hueValue">0°</span></label>
        <input type="range" id="hueSlider" min="0" max="360" value="0">
      </div>
      
      <div class="control-group">
        <label>کنتراست <span id="contrastValue">1.0x</span></label>
        <input type="range" id="contrastSlider" min="0.5" max="3" step="0.1" value="1">
      </div>
      
      <div class="control-group">
        <label>فرکانس بافت <span id="freqValue">1.0x</span></label>
        <input type="range" id="freqSlider" min="0.5" max="3" step="0.1" value="1">
      </div>
      
      <div class="control-group">
        <label>درخشش <span id="glowValue">0%</span></label>
        <input type="range" id="glowSlider" min="0" max="1" step="0.05" value="0">
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
